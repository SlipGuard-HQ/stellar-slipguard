[workspace]
resolver = "2"
members = [
    "contracts/router",
    "contracts/mock_token",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SlipGuard-HQ/stellar-slipguard"
homepage = "https://github.com/SlipGuard-HQ/stellar-slipguard"
authors = ["SlipGuard HQ"]

[workspace.dependencies]
soroban-sdk = "26"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
